name: StreamVault Reels (Cortes → Artefacto)

# ═══════════════════════════════════════════════════════════════════════
# Worker de processamento — 1 job = 1 corte = 1 artefacto de run.
#
# MUDANÇA DE ARQUITETURA em relação à versão anterior:
#   - ABANDONADO: qualquer publicação automática (Facebook Reels API,
#     Facebook /videos, /photos). Este workflow não publica nada em
#     lugar nenhum.
#   - AGORA: baixa a fonte (HTTP ou torrent), corta o trecho pedido,
#     aplica o efeito fixo (fundo desfocado 9:16 + header no topo,
#     conforme o comando ffmpeg de referência) e sobe o clipe pronto
#     como ARTEFACTO do run (actions/upload-artifact). Você baixa
#     manualmente na aba Actions do GitHub e posta manualmente no
#     YouTube.
#   - "Quando" e "quantos cortes" continuam decididos ANTES deste
#     workflow existir (Cloudflare Worker), só que agora sem fila nem
#     cron — o worker dispara isto na hora, pra cada corte.
#
# DUAS PREMISSAS DO COMANDO FFMPEG QUE HERDEI LITERALMENTE E NÃO MUDEI
# POR CONTA PRÓPRIA — confira se valem pra sua fonte:
#   1. `-map 0:1` assume que a faixa de áudio está sempre no stream
#      índice 1. Se a fonte tiver uma disposição de streams diferente
#      (ex: legendas embutidas antes do áudio), isso vai mapear o
#      stream errado ou falhar. Não troquei pra `-map 0:a:0` por conta
#      própria — troque se seus arquivos variarem nisso.
#   2. `drawtext` com `textfile=` em vez de `text=` direto — testado
#      com header contendo `:`, `'`, `—` e `%` (comando real, vídeo
#      gerado, frame extraído e inspecionado visualmente): `:`, `'` e
#      `—` renderizam sem problema com textfile=. O `%` sozinho
#      QUEBRAVA O TEXTO INTEIRO — sem erro fatal, só um warning "Stray
#      %", mas o header inteiro sumia do vídeo (o parser de expansão
#      do próprio drawtext trata `%` como início de `%{...}`,
#      independente de vir de text= ou textfile=). Corrigido abaixo
#      com `expansion=none` no filtro, que desliga essa sintaxe de
#      expansão (não precisamos de timecode/frame_num aqui) e faz o
#      `%` virar caractere literal sem precisar escapar nada no texto.
#   3. Headers longos ESTOURAM a largura de 1080px nos dois lados —
#      não tem quebra de linha nem auto-shrink no filtro. Teste com
#      "Ele disse: 'nunca mais' — 100%" (31 caracteres) já saiu cortado
#      nas bordas em fontsize=72. Prefira headers curtos (~20-25
#      caracteres) até ter uma lógica de fontsize dinâmico.
#
# FONTE: o comando original usa Segoe UI Emoji do Windows
# (C:\Windows\Fonts\seguiemj.ttf), que não existe no runner Ubuntu.
# Troquei para DejaVu Sans Bold (via apt, fonts-dejavu-core). Efeito
# colateral real: emoji colorido não renderiza em drawtext do ffmpeg
# de qualquer forma (limitação de glyph colorido no freetype/libass),
# então headers com emoji vão sair com um placeholder quebrado — use
# texto puro no header_text.
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
      video_url:
        description: 'URL HTTP(S) direta do vídeo fonte, ou magnet/torrent'
        required: true
      cut_start_seconds:
        description: 'Ponto de início do corte, em segundos'
        required: true
      cut_duration_seconds:
        description: 'Duração do corte, em segundos'
        required: false
        default: '60'
      header_text:
        description: 'Texto sobreposto no topo do vídeo (sem emoji — não renderiza em drawtext)'
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    # Agora há encode de verdade (libx264 preset fast sobre o frame
    # inteiro 1080x1920, não só remux), então a folga é maior que na
    # versão anterior (que era só stream copy). 25min cobre corte de
    # até alguns minutos com margem de sobra em runner padrão (2 vCPU).
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      WORK_DIR: /tmp/reels_work/${{ inputs.job_id }}

    steps:
      - name: Preparar ambiente
        run: |
          mkdir -p "$WORK_DIR"
          echo "JOB_ID=${{ inputs.job_id }}" >> $GITHUB_ENV

      # Cache de pacotes. fonts-dejavu-core entra aqui pro drawtext ter
      # uma fonte bold disponível no runner (ver nota de fonte acima).
      - name: Instalar ffmpeg + libtorrent + fonte (cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg python3-libtorrent fonts-dejavu-core
          version: 1.0
          execute_install_scripts: true

      - name: Atualizar cache do linker (ldconfig)
        run: sudo ldconfig

      - name: Baixar vídeo (HTTP direto ou torrent)
        run: |
          URL="$VIDEO_URL_ENV"
          if [[ "$URL" == magnet:* ]] || [[ "$URL" == *.torrent ]] || [[ "$URL" == *infohash:* ]]; then
            echo "→ Modo torrent (libtorrent Python)"
            mkdir -p "$WORK_DIR/torrent_dl"
            # Baixa o ficheiro de vídeo inteiro do torrent (sem seek
            # arbitrário possível via libtorrent), depois corta
            # localmente igual ao modo HTTP.
            #
            # Este step SÓ baixa — não identifica nem move o ficheiro.
            # Proposital: chamar Path.stat() logo após o loop de
            # download, no mesmo processo Python, é uma corrida real
            # (progress==100%/is_seeding não garante que o disk-writer
            # assíncrono do libtorrent já sincronizou os últimos bytes
            # em disco). A detecção roda num STEP SEPARADO via `find`
            # (bash), o que dá folga real de tempo entre "baixou" e
            # "leu o arquivo".
            python3 << 'PYEOF'
          import libtorrent as lt
          import os, sys, time

          url      = os.environ['VIDEO_URL_ENV']
          dest_dir = os.environ['WORK_DIR'] + '/torrent_dl'
          MAX_WAIT = 1800  # 30min — corte é conteúdo curto, não vale esperar mais que isso

          ses = lt.session({
            'listen_interfaces':       '0.0.0.0:6881',
            'enable_dht':              True,
            'enable_lsd':              True,
            'use_dht_as_fallback':     True,
            'dht_restrict_routing_ips': False,
            'dht_bootstrap_nodes':     'router.bittorrent.com:6881,router.utorrent.com:6881,dht.transmissionbt.com:6881,dht.aelitis.com:6881',
            'alert_mask':              0xffffffff,
          })
          try: ses.apply_settings({'connections_limit':200,'active_downloads':1,'active_seeds':0})
          except Exception as e: print(f"⚠ apply_settings parcial: {e}")

          params = lt.add_torrent_params()
          params.save_path = dest_dir
          if url.startswith('magnet:') or 'infohash:' in url:
            params = lt.parse_magnet_uri(url)
            params.save_path = dest_dir
            print(f"  Adicionando magnet: {url[:80]}...")
          else:
            import urllib.request
            torrent_path = '/tmp/reel_input.torrent'
            urllib.request.urlretrieve(url, torrent_path)
            info = lt.torrent_info(torrent_path)
            params.ti = info
            print(f"  Torrent: {info.name()} ({info.total_size() // (1024*1024)} MB)")

          handle = ses.add_torrent(params)
          print("  Aguardando metadados + download...")
          start_t = time.time()
          last_pct = -1
          while True:
            s = handle.status()
            pct = int(s.progress * 100)
            if pct != last_pct:
              print(f"  [{int(time.time()-start_t):4d}s] {pct:3d}% | peers: {s.num_peers}")
              last_pct = pct
            if s.is_seeding or s.progress >= 1.0:
              print(f"✓ Download completo ({int(time.time()-start_t)}s)")
              break
            if (time.time() - start_t) > MAX_WAIT:
              print(f"✗ Timeout de {MAX_WAIT}s sem completar — sem seeders suficientes pra um corte rápido")
              sys.exit(1)
            ses.wait_for_alert(1000)

          ses.remove_torrent(handle, 0)
          print(f"✓ Torrent baixado em {dest_dir} — detecção do arquivo fica pro próximo step")
          PYEOF
          else
            echo "→ Modo HTTP direto"
            curl -L --retry 3 --retry-delay 5 --progress-bar --fail \
              -o "$WORK_DIR/source.video" \
              "$URL"
          fi
        env:
          VIDEO_URL_ENV: ${{ inputs.video_url }}

      - name: Detectar ficheiro de vídeo baixado
        run: |
          if [ ! -f "$WORK_DIR/source.video" ]; then
            echo "→ Localizando vídeo baixado via torrent (find, mesma técnica de sempre)"
            VIDEO_EXTS="mp4 mkv avi mov wmv flv ts m4v webm mpg mpeg"
            FOUND=""
            for ext in $VIDEO_EXTS; do
              FOUND=$(find "$WORK_DIR/torrent_dl" -iname "*.${ext}" | head -1)
              if [ -n "$FOUND" ]; then break; fi
            done
            if [ -z "$FOUND" ]; then
              echo "✗ Nenhum ficheiro de vídeo encontrado no torrent"
              find "$WORK_DIR/torrent_dl" -type f
              exit 1
            fi
            mv "$FOUND" "$WORK_DIR/source.video"
            rm -rf "$WORK_DIR/torrent_dl" /tmp/reel_input.torrent
          fi

          SIZE=$(stat -c%s "$WORK_DIR/source.video" 2>/dev/null || echo 0)
          echo "✓ Vídeo pronto: $(du -sh "$WORK_DIR/source.video" | cut -f1) ($SIZE bytes)"
          if [ "$SIZE" -lt 10000 ]; then
            echo "✗ Ficheiro demasiado pequeno — download falhou"
            exit 1
          fi

      - name: Preparar arquivo do header (evita escapar texto no filtro)
        env:
          HEADER_TEXT: ${{ inputs.header_text }}
        run: |
          # textfile= lê o conteúdo bruto do arquivo — não precisa
          # escapar : ' % dentro do texto, só o texto puro precisa
          # existir aqui. Isso é o que troquei em relação ao comando
          # original (que usava text='HEADER' direto na string do
          # filtro, o que quebra com qualquer desses caracteres).
          printf '%s' "$HEADER_TEXT" > "$WORK_DIR/header.txt"
          echo "✓ Header gravado: $(cat "$WORK_DIR/header.txt")"

      - name: Cortar + aplicar fundo desfocado + header
        env:
          CUT_START: ${{ inputs.cut_start_seconds }}
          CUT_DURATION: ${{ inputs.cut_duration_seconds }}
        run: |
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          OUT="$WORK_DIR/output.mp4"

          # Mesmo filtro do comando de referência, só com os
          # placeholders (INICIO/ARQUIVO/HEADER/SAIDA) preenchidos por
          # variáveis do job. Fundo: blur 9:16 preenchendo o frame.
          # Frente: vídeo original inteiro, escalado sem cortar,
          # centralizado por cima do fundo desfocado. Header fixo no
          # topo.
          ffmpeg -hide_banner -loglevel warning \
            -ss "$CUT_START" -i "$WORK_DIR/source.video" \
            -t "$CUT_DURATION" \
            -filter_complex "[0:0]split=2[bg][fg];[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=30:10[blur];[fg]scale=1080:1920:force_original_aspect_ratio=decrease[main];[blur][main]overlay=(W-w)/2:(H-h)/2[base];[base]drawtext=textfile='$WORK_DIR/header.txt':expansion=none:fontfile='$FONT':fontsize=72:fontcolor=white:borderw=5:bordercolor=black:x=(w-text_w)/2:y=100[v]" \
            -map "[v]" -map 0:1 \
            -c:v libx264 -preset fast -crf 21 \
            -c:a aac -b:a 192k -ac 2 \
            -pix_fmt yuv420p -movflags +faststart \
            -y "$OUT"

          if [ ! -s "$OUT" ]; then
            echo "✗ Processamento falhou ou gerou ficheiro vazio — cut_start ($CUT_START s) pode estar além da duração do vídeo, ou o stream de áudio não está no índice 1 (ver nota no topo do arquivo)"
            exit 1
          fi
          echo "✓ Corte processado: $(du -sh "$OUT" | cut -f1)"
          rm -f "$WORK_DIR/source.video"

      - name: Subir artefacto (pronto pra você baixar e postar manualmente)
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.job_id }}
          path: /tmp/reels_work/${{ inputs.job_id }}/output.mp4
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$WORK_DIR"
          echo "✓ Workspace limpo"
